plugins { id 'com.android.application' }

android {
    namespace 'com.example.nhom4_quanlycongviec'
    // SDK tren may ban co ten folder android-37.0 (khong phai android-37).
    // Dung ten target nguyen van de AGP co co hoi nhan dung SDK da cai.
    // Neu AGP 8.7.3 khong xu ly duoc API 37.0, dung BUILD_OFFLINE_KHONG_GRADLE.ps1.
    compileSdkVersion 'android-37.0'
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.example.nhom4_quanlycongviec'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
